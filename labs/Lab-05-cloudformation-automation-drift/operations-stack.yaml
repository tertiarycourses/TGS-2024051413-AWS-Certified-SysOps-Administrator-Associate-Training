AWSTemplateFormatVersion: '2010-09-09'
Description: TGS-2024051413 Lab 05 controlled operations stack
Parameters:
  Environment: {Type: String, AllowedValues: [lab, test], Default: lab}
Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      VersioningConfiguration: {Status: Enabled}
      Tags: [{Key: Course, Value: TGS-2024051413}, {Key: Environment, Value: !Ref Environment}]
Outputs:
  BucketName: {Value: !Ref EvidenceBucket}
