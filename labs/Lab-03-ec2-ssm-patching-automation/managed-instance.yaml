AWSTemplateFormatVersion: '2010-09-09'
Description: TGS-2024051413 Lab 03 managed EC2 node
Parameters:
  CourseTag: {Type: String, Default: TGS-2024051413}
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  ManagedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'SysOps-Lab03-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: [ec2.amazonaws.com]}, Action: ['sts:AssumeRole']}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref ManagedRole]}
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: {Name: !Ref Profile}
      Tags: [{Key: Course, Value: !Ref CourseTag}, {Key: Name, Value: SysOps-Lab03}]
Outputs:
  InstanceId: {Value: !Ref Instance}
